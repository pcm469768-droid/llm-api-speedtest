name: bench

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: 准备站点配置
        run: |
          cp stations.example.json stations.json
          # 用 Secrets 里的真实密钥替换占位符(逐个站点,可选)
      - name: 跑测速
        run: go run ./cmd/llm-api-speedtest run -config stations.json -concurrency 4 -timeout 120 -json report.json
      - name: 更新 README 排行榜
        run: go run ./cmd/llm-api-speedtest write-readme -report report.json -readme README.md
      - name: 提交结果
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bench: 更新测速排行榜"
          file_pattern: "README.md report.json"
